<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bruce Xie - AI Agent Engineer & RAG Specialist Resume">
    <meta name="keywords" content="AI, Machine Learning, RAG, LLM, Algorithm Engineer">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://xiemingblog.github.io/xieMing/resume/">
    <meta property="og:title" content="Bruce Xie - AI Agent Engineer & RAG Specialist">
    <meta property="og:description" content="Experienced AI Agent Algorithm Engineer specializing in RAG, LLM, and Machine Learning. Master's in Computer Science from Fudan University.">
    <meta property="og:image" content="https://avatars.githubusercontent.com/u/107664670?v=4">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://xiemingblog.github.io/xieMing/resume/">
    <meta property="twitter:title" content="Bruce Xie - AI Agent Engineer & RAG Specialist">
    <meta property="twitter:description" content="Experienced AI Agent Algorithm Engineer specializing in RAG, LLM, and Machine Learning. Master's in Computer Science from Fudan University.">
    <meta property="twitter:image" content="https://avatars.githubusercontent.com/u/107664670?v=4">

    <title>Bruce Xie - Resume</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Skip to main content for accessibility -->
    <a href="#main-content" class="skip-to-main">Skip to main content</a>

    <!-- Theme & Language Toggle -->
    <div class="top-controls">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark/light theme">
            <i class="fas fa-moon"></i>
        </button>
        <a href="zh/" class="lang-switch" aria-label="Switch to Chinese version">
            <i class="fas fa-language"></i> 中文
        </a>
    </div>

    <!-- Header Section -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <img id="avatar" src="" alt="Profile Picture" class="avatar">
                <div class="header-text">
                    <h1 id="name" class="name"></h1>
                    <p id="title" class="title"></p>
                    <p id="bio" class="bio"></p>
                    <div class="contact-info">
                        <a id="github-link" href="" target="_blank" rel="noopener noreferrer" class="contact-item">
                            <i class="fab fa-github"></i>
                            <span>GitHub</span>
                        </a>
                        <a id="email-link" href="" class="contact-item">
                            <i class="fas fa-envelope"></i>
                            <span>Email</span>
                        </a>
                        <a id="linkedin-link" href="" target="_blank" rel="noopener noreferrer" class="contact-item" style="display: none;">
                            <i class="fab fa-linkedin"></i>
                            <span>LinkedIn</span>
                        </a>
                        <span id="location" class="contact-item">
                            <i class="fas fa-map-marker-alt"></i>
                            <span></span>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
        <div class="container">

            <!-- Skills Section -->
            <section class="section" id="skills-section">
                <h2 class="section-title">
                    <i class="fas fa-code"></i>
                    Technical Skills
                </h2>
                <div class="skills-grid">
                    <div class="skill-category">
                        <h3>Languages</h3>
                        <div id="languages" class="skill-tags"></div>
                    </div>
                    <div class="skill-category">
                        <h3>Frameworks</h3>
                        <div id="frameworks" class="skill-tags"></div>
                    </div>
                    <div class="skill-category">
                        <h3>Tools</h3>
                        <div id="tools" class="skill-tags"></div>
                    </div>
                    <div class="skill-category">
                        <h3>Expertise</h3>
                        <div id="areas" class="skill-tags"></div>
                    </div>
                </div>
            </section>

            <!-- Experience Section -->
            <section class="section" id="experience-section">
                <h2 class="section-title">
                    <i class="fas fa-briefcase"></i>
                    Work Experience
                </h2>
                <div id="experience-list" class="timeline"></div>
            </section>

            <!-- Internships Section -->
            <section class="section" id="internships-section">
                <h2 class="section-title">
                    <i class="fas fa-user-graduate"></i>
                    Internship Experience
                </h2>
                <div id="internships-list" class="timeline"></div>
            </section>

            <!-- Projects Section -->
            <section class="section" id="projects-section">
                <h2 class="section-title">
                    <i class="fas fa-folder-open"></i>
                    Selected Projects
                </h2>

                <!-- Filter Controls -->
                <div class="project-filters">
                    <div class="filter-group">
                        <label>
                            <input type="checkbox" id="filter-forks" checked>
                            Include Forks
                        </label>
                        <label>
                            <input type="checkbox" id="filter-archived">
                            Include Archived
                        </label>
                    </div>
                    <div class="filter-group">
                        <select id="category-filter">
                            <option value="all">All Categories</option>
                        </select>
                        <input type="text" id="search-filter" placeholder="Search projects...">
                    </div>
                    <div class="stats">
                        <span id="project-count"></span>
                    </div>
                </div>

                <!-- Projects Grid -->
                <div id="projects-grid" class="projects-grid">
                    <!-- Skeleton loading cards -->
                    <div class="skeleton-card">
                        <div class="skeleton skeleton-title"></div>
                        <div class="skeleton skeleton-text"></div>
                        <div class="skeleton skeleton-text"></div>
                        <div class="skeleton skeleton-text short"></div>
                    </div>
                    <div class="skeleton-card">
                        <div class="skeleton skeleton-title"></div>
                        <div class="skeleton skeleton-text"></div>
                        <div class="skeleton skeleton-text"></div>
                        <div class="skeleton skeleton-text short"></div>
                    </div>
                    <div class="skeleton-card">
                        <div class="skeleton skeleton-title"></div>
                        <div class="skeleton skeleton-text"></div>
                        <div class="skeleton skeleton-text"></div>
                        <div class="skeleton skeleton-text short"></div>
                    </div>
                </div>
            </section>

            <!-- Education Section -->
            <section class="section" id="education-section">
                <h2 class="section-title">
                    <i class="fas fa-graduation-cap"></i>
                    Education
                </h2>
                <div id="education-list" class="timeline"></div>
            </section>

        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; <span id="current-year"></span> <span id="footer-name"></span></p>
            <p class="footer-stats">
                Last updated: <span id="last-updated"></span>
            </p>
        </div>
    </footer>

    <!-- Load data before main script -->
    <script src="../assets/js/data-config.js"></script>
    <script src="../assets/js/data-repos.js"></script>
    <script src="../assets/js/script.js"></script>
</body>
</html>
